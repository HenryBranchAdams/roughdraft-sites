name: Fork publication safeguard

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: fork-publication-safeguard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-no-official-package-publication:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Verify fork cannot publish the official package
        run: node --test scripts/check-fork-publish-safety.test.mjs
